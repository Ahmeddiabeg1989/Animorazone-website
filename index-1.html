<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animora zone</title>
<meta name="description" content="منصة إنتاج ونشر الأفلام والأنمي تلقائياً">
<meta name="theme-color" content="#0f0b1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f0b1a;
    --surface: #1a1430;
    --surface-2: #241c42;
    --text: #f1eefb;
    --muted: #a79fc4;
    --accent: #8b5cf6;
    --accent-2: #ec4899;
    --ok: #34d399;
    --warn: #fbbf24;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 20px 0 8px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px;
  }
  h1 { font-size: 20px; }
  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .btn[hidden] { display: none; }
  .hero { padding: 28px 0 20px; }
  .hero h2 { font-size: 26px; line-height: 1.3; margin-bottom: 8px; }
  .hero p { color: var(--muted); max-width: 560px; }
  .stats { display: flex; gap: 12px; margin: 20px 0 8px; flex-wrap: wrap; }
  .stat {
    background: var(--surface); border-radius: var(--radius);
    padding: 14px 18px; min-width: 120px;
  }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  h3.section { font-size: 18px; margin: 28px 0 12px; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
    border: 1px solid rgba(255,255,255,.04);
  }
  .card h4 { font-size: 16px; }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  .badge {
    padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--surface-2); color: var(--muted);
  }
  .badge.published { color: var(--ok); }
  .badge.processing { color: var(--warn); }
  .card a.watch {
    margin-top: auto; text-align: center; text-decoration: none;
    background: var(--surface-2); color: var(--text);
    padding: 9px 12px; border-radius: 12px; font-size: 14px; font-weight: 600;
  }
  .empty, .error {
    background: var(--surface); border-radius: var(--radius);
    padding: 28px; text-align: center; color: var(--muted);
  }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">▶</div>
      <h1>Animora zone</h1>
    </div>
    <button id="installBtn" class="btn" hidden>تثبيت التطبيق</button>
  </header>

  <section class="hero">
    <h2>أفلام وأنمي تتنتج وتتنشر تلقائياً</h2>
    <p>تابع آخر الحلقات والأعمال أول بأول من مكان واحد.</p>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>إجمالي الحلقات</span></div>
      <div class="stat"><b id="statPublished">0</b><span>منشورة</span></div>
    </div>
  </section>

  <h3 class="section">آخر الحلقات</h3>
  <div id="list" class="grid" aria-live="polite"></div>

  <footer>© <span id="year"></span> Animora zone</footer>
</div>

<script>
(function () {
  var STATUS = { published: "منشورة", processing: "قيد الإنتاج", draft: "مسودة" };
  var list = document.getElementById("list");

  function safeUrl(u) {
    try {
      var p = new URL(u, location.href);
      return (p.protocol === "https:" || p.protocol === "http:") ? p.href : null;
    } catch (e) { return null; }
  }

  function fmtDate(s) {
    var d = new Date(s);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });
  }

  function message(cls, text) {
    list.innerHTML = "";
    var box = document.createElement("div");
    box.className = cls;
    box.style.gridColumn = "1 / -1";
    box.textContent = text;
    list.appendChild(box);
  }

  function render(episodes) {
    document.getElementById("statTotal").textContent = episodes.length;
    document.getElementById("statPublished").textContent =
      episodes.filter(function (e) { return e.status === "published"; }).length;

    if (!episodes.length) { message("empty", "لسه مفيش حلقات منشورة."); return; }

    episodes.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    list.innerHTML = "";
    episodes.forEach(function (ep) {
      var card = document.createElement("article");
      card.className = "card";

      var h = document.createElement("h4");
      h.textContent = ep.title || "بدون عنوان";
      card.appendChild(h);

      var meta = document.createElement("div");
      meta.className = "meta";
      var date = document.createElement("span");
      date.textContent = fmtDate(ep.date);
      var badge = document.createElement("span");
      badge.className = "badge " + (STATUS[ep.status] ? ep.status : "");
      badge.textContent = STATUS[ep.status] || "غير محدد";
      meta.appendChild(date);
      meta.appendChild(badge);
      card.appendChild(meta);

      var url = ep.url && safeUrl(ep.url);
      if (url) {
        var a = document.createElement("a");
        a.className = "watch";
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "مشاهدة";
        card.appendChild(a);
      }
      list.appendChild(card);
    });
  }

  fetch("episodes.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { render(Array.isArray(data.episodes) ? data.episodes : []); })
    .catch(function () { message("error", "تعذّر تحميل الحلقات. جرّب تحدّث الصفحة."); });

  document.getElementById("year").textContent = new Date().getFullYear();

  // تثبيت التطبيق (PWA)
  var deferred;
  var btn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
  });
  window.addEventListener("appinstalled", function () { btn.hidden = true; });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
