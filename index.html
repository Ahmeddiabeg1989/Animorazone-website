<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animora zone</title>
<meta name="description" content="منصة إنتاج ونشر الأفلام والأنمي تلقائياً">
<meta name="theme-color" content="#0f0b1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f0b1a;
    --surface: #1a1430;
    --surface-2: #241c42;
    --text: #f1eefb;
    --muted: #a79fc4;
    --accent: #8b5cf6;
    --accent-2: #ec4899;
    --ok: #34d399;
    --warn: #fbbf24;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 8px; flex-wrap: wrap; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn-ghost { background: var(--surface-2); border: 1px solid rgba(255,255,255,.12); }
  .user { display: flex; align-items: center; gap: 8px; background: var(--surface); padding: 4px 12px 4px 6px; border-radius: 999px; font-size: 13px; }
  .user[hidden] { display: none; }
  .user img { border-radius: 50%; width: 32px; height: 32px; object-fit: cover; }
  .user img[hidden] { display: none; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0 4px; }
  .auth-msg { background: var(--surface); border-radius: 12px; padding: 10px 14px; margin: 8px 0; font-size: 14px; color: var(--muted); }
  .auth-msg[hidden] { display: none; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px;
  }
  h1 { font-size: 20px; }
  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .btn[hidden] { display: none; }

  .hero { padding: 20px 0 8px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tags span {
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
    color: #d8c9ff; background: rgba(139, 92, 246, .16); border: 1px solid rgba(139, 92, 246, .35);
  }
  .hero .lead { font-size: 19px; line-height: 1.6; color: var(--text); max-width: 560px; }
  .stats { display: flex; gap: 10px; margin: 16px 0 4px; flex-wrap: wrap; }
  .stat { background: var(--surface); border-radius: var(--radius); padding: 12px 16px; min-width: 100px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--muted); font-size: 12px; }

  /* التبويبات */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: var(--surface); padding: 6px; border-radius: 14px; margin: 20px 0 12px;
  }
  .tab {
    border: 0; background: transparent; color: var(--muted); font: inherit;
    font-size: 15px; font-weight: 700; padding: 10px; border-radius: 10px; cursor: pointer;
  }
  .tab[aria-selected="true"] {
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  /* فلتر الأنواع */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid rgba(255,255,255,.08); background: var(--surface);
    color: var(--muted); font: inherit; font-size: 14px; padding: 6px 14px;
    border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { color: #fff; background: var(--surface-2); border-color: var(--accent); }

  h3.section { font-size: 18px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  h3.section small { color: var(--muted); font-size: 13px; font-weight: 400; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card {
    background: var(--surface); border-radius: var(--radius); padding: 16px;
    display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,.04);
  }
  .card h4 { font-size: 16px; }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
  .badge.published { color: var(--ok); }
  .badge.processing { color: var(--warn); }
  a.watch {
    text-align: center; text-decoration: none; background: var(--surface-2); color: var(--text);
    padding: 9px 12px; border-radius: 12px; font-size: 14px; font-weight: 600;
  }
  .card a.watch { margin-top: auto; }

  /* المسلسلات */
  details.series {
    background: var(--surface); border-radius: var(--radius); margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,.04); overflow: hidden;
  }
  details.series summary {
    list-style: none; cursor: pointer; padding: 16px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
  }
  details.series summary::-webkit-details-marker { display: none; }
  .s-title { font-size: 17px; font-weight: 700; }
  .s-desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .s-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; font-size: 12px; color: var(--muted); }
  .ep-list { border-top: 1px solid rgba(255,255,255,.06); }
  .ep {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .ep:last-child { border-bottom: 0; }
  .ep-name { font-size: 15px; }
  .ep-date { color: var(--muted); font-size: 12px; }
  .ep-side { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .ep a.watch { padding: 6px 12px; font-size: 13px; }

  .empty, .error { background: var(--surface); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--muted); }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">▶</div>
      <h1>Animora zone</h1>
    </div>
    <div class="actions">
      <button id="installBtn" class="btn" hidden>تثبيت التطبيق</button>
      <button id="loginBtn" class="btn btn-ghost" type="button" hidden>الدخول بجوجل</button>
      <div id="userBox" class="user" hidden>
        <img id="userPhoto" alt="" width="32" height="32" referrerpolicy="no-referrer">
        <span id="userName"></span>
        <button id="logoutBtn" class="link" type="button">خروج</button>
      </div>
    </div>
  </header>
  <div id="authMsg" class="auth-msg" role="status" hidden></div>

  <section class="hero">
    <p class="lead">عالم من القصص الأصلية، ومحتوى جديد باستمرار.</p>
    <div class="stats">
      <div class="stat"><b id="statClips">0</b><span>مقاطع</span></div>
      <div class="stat"><b id="statSeries">0</b><span>مسلسلات</span></div>
      <div class="stat"><b id="statPublished">0</b><span>منشورة</span></div>
    </div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-clips" data-tab="clips" aria-selected="true">المقاطع</button>
    <button class="tab" role="tab" id="tab-series" data-tab="series" aria-selected="false">المسلسلات</button>
  </div>

  <div id="chips" class="chips" aria-label="تصفية حسب النوع"></div>
  <div id="content" aria-live="polite"></div>

  <footer>© <span id="year"></span> Animora zone</footer>
</div>

<script>
(function () {
  var STATUS = { published: "منشورة", processing: "قيد الإنتاج", draft: "مسودة" };
  var content = document.getElementById("content");
  var chipsBox = document.getElementById("chips");
  var data = { genres: [], clips: [], series: [] };
  var state = { tab: "clips", genre: "all" };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function safeUrl(u) {
    try {
      var p = new URL(u, location.href);
      return (p.protocol === "https:" || p.protocol === "http:") ? p.href : null;
    } catch (e) { return null; }
  }

  function fmtDate(s) {
    var d = new Date(s);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });
  }

  function byDateDesc(a, b) { return new Date(b.date || 0) - new Date(a.date || 0); }

  function genreName(id) {
    for (var i = 0; i < data.genres.length; i++) {
      if (data.genres[i].id === id) return data.genres[i].name;
    }
    return "أخرى";
  }

  function badge(status) {
    var b = el("span", "badge " + (STATUS[status] ? status : ""), STATUS[status] || "غير محدد");
    return b;
  }

  function watchLink(url) {
    var safe = url && safeUrl(url);
    if (!safe) return null;
    var a = el("a", "watch", "مشاهدة");
    a.href = safe;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    return a;
  }

  function message(cls, text) {
    content.innerHTML = "";
    content.appendChild(el("div", cls, text));
  }

  /* ---------- المقاطع ---------- */
  function clipCard(c) {
    var card = el("article", "card");
    card.appendChild(el("h4", null, c.title || "بدون عنوان"));
    var meta = el("div", "meta");
    meta.appendChild(el("span", null, fmtDate(c.date)));
    meta.appendChild(badge(c.status));
    card.appendChild(meta);
    var w = watchLink(c.url);
    if (w) card.appendChild(w);
    return card;
  }

  function renderClips() {
    var clips = data.clips.slice();
    if (state.genre !== "all") clips = clips.filter(function (c) { return (c.genre || "other") === state.genre; });
    if (!clips.length) { message("empty", "لسه مفيش مقاطع في القسم ده."); return; }

    // ترتيب الأقسام: حسب ترتيب الأنواع في الملف، وبعدها "أخرى"
    var order = data.genres.map(function (g) { return g.id; });
    var groups = {};
    clips.forEach(function (c) {
      var g = order.indexOf(c.genre) >= 0 ? c.genre : "other";
      (groups[g] = groups[g] || []).push(c);
    });
    order.push("other");

    content.innerHTML = "";
    order.forEach(function (gid) {
      var list = groups[gid];
      if (!list || !list.length) return;
      list.sort(byDateDesc);
      var h = el("h3", "section", gid === "other" ? "أخرى" : genreName(gid));
      h.appendChild(el("small", null, "(" + list.length + ")"));
      content.appendChild(h);
      var grid = el("div", "grid");
      list.forEach(function (c) { grid.appendChild(clipCard(c)); });
      content.appendChild(grid);
    });
  }

  /* ---------- المسلسلات ---------- */
  function seriesBlock(s) {
    var eps = Array.isArray(s.episodes) ? s.episodes.slice().sort(byDateDesc) : [];
    var d = el("details", "series");
    var sum = el("summary");
    var left = el("div");
    left.appendChild(el("div", "s-title", s.title || "بدون عنوان"));
    if (s.description) left.appendChild(el("div", "s-desc", s.description));
    var side = el("div", "s-side");
    side.appendChild(el("span", "badge", genreName(s.genre)));
    side.appendChild(el("span", null, eps.length + " حلقة"));
    sum.appendChild(left);
    sum.appendChild(side);
    d.appendChild(sum);

    var list = el("div", "ep-list");
    if (!eps.length) {
      list.appendChild(el("div", "ep", "لسه مفيش حلقات."));
    } else {
      eps.forEach(function (e) {
        var row = el("div", "ep");
        var info = el("div");
        info.appendChild(el("div", "ep-name", e.title || "بدون عنوان"));
        info.appendChild(el("div", "ep-date", fmtDate(e.date)));
        var sideBox = el("div", "ep-side");
        sideBox.appendChild(badge(e.status));
        var w = watchLink(e.url);
        if (w) sideBox.appendChild(w);
        row.appendChild(info);
        row.appendChild(sideBox);
        list.appendChild(row);
      });
    }
    d.appendChild(list);
    return d;
  }

  function renderSeries() {
    var series = data.series.slice();
    if (state.genre !== "all") series = series.filter(function (s) { return (s.genre || "other") === state.genre; });
    if (!series.length) { message("empty", "لسه مفيش مسلسلات في القسم ده."); return; }
    content.innerHTML = "";
    series.forEach(function (s) { content.appendChild(seriesBlock(s)); });
  }

  /* ---------- الفلاتر والتبويبات ---------- */
  function renderChips() {
    var items = state.tab === "clips" ? data.clips : data.series;
    var present = {};
    items.forEach(function (i) { present[i.genre || "other"] = true; });

    chipsBox.innerHTML = "";
    function addChip(id, label) {
      var b = el("button", "chip", label);
      b.type = "button";
      b.setAttribute("aria-pressed", state.genre === id ? "true" : "false");
      b.addEventListener("click", function () { state.genre = id; render(); });
      chipsBox.appendChild(b);
    }
    addChip("all", "الكل");
    data.genres.forEach(function (g) { if (present[g.id]) addChip(g.id, g.name); });
    if (present.other) addChip("other", "أخرى");
  }

  function render() {
    // لو النوع المختار مالوش عناصر في التبويب الحالي نرجع على "الكل"
    var items = state.tab === "clips" ? data.clips : data.series;
    if (state.genre !== "all" && !items.some(function (i) { return (i.genre || "other") === state.genre; })) {
      state.genre = "all";
    }
    renderChips();
    if (state.tab === "clips") renderClips(); else renderSeries();
  }

  function setTab(tab) {
    state.tab = tab;
    state.genre = "all";
    ["clips", "series"].forEach(function (t) {
      document.getElementById("tab-" + t).setAttribute("aria-selected", t === tab ? "true" : "false");
    });
    render();
  }

  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { setTab(b.getAttribute("data-tab")); });
  });

  function stats() {
    document.getElementById("statClips").textContent = data.clips.length;
    document.getElementById("statSeries").textContent = data.series.length;
    var pub = data.clips.filter(function (c) { return c.status === "published"; }).length;
    data.series.forEach(function (s) {
      (s.episodes || []).forEach(function (e) { if (e.status === "published") pub++; });
    });
    document.getElementById("statPublished").textContent = pub;
  }

  fetch("episodes.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      data.genres = Array.isArray(j.genres) ? j.genres : [];
      data.clips = Array.isArray(j.clips) ? j.clips : (Array.isArray(j.episodes) ? j.episodes : []);
      data.series = Array.isArray(j.series) ? j.series : [];
      stats();
      render();
    })
    .catch(function () { message("error", "تعذّر تحميل المحتوى. جرّب تحدّث الصفحة."); });

  document.getElementById("year").textContent = new Date().getFullYear();

  // تثبيت التطبيق (PWA)
  var deferred;
  var btn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
  });
  window.addEventListener("appinstalled", function () { btn.hidden = true; });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
<script type="module" src="auth.js"></script>
</body>
</html>
